name: Build Windows Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install openai-whisper pyinstaller tiktoken

      - name: Build EXE
        run: pyinstaller sbobinator.spec

      - name: Download ffmpeg
        run: |
          curl -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          7z x ffmpeg.zip -offmpeg_tmp
          $ffmpegExe = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination dist/ffmpeg.exe
        shell: pwsh

      - name: Download medium model
        run: |
          mkdir dist\models
          curl -L -o dist/models/medium.pt https://openaipublic.azureedge.net/main/whisper/models/345ae4da62f9b3d59415adc60127b97c714f32e89e936602e85993674d08dcb1/medium.pt

      - name: Create bundle zip
        run: |
          cd dist
          7z a -mx1 ../Sbobinator-Bundle.zip Sbobinator.exe ffmpeg.exe models/
        shell: pwsh

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: Sbobinator-Bundle
          path: Sbobinator-Bundle.zip
          retention-days: 30

      - name: Upload exe only (senza modello)
        uses: actions/upload-artifact@v4
        with:
          name: Sbobinator-ExeOnly
          path: |
            dist/Sbobinator.exe
            dist/ffmpeg.exe
          retention-days: 30
