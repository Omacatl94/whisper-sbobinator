name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install openai-whisper pyinstaller
          pip install tiktoken

      - name: Build EXE
        run: pyinstaller sbobinator.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sbobinator-Windows
          path: dist/Sbobinator.exe
