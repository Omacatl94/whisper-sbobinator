name: Build Windows Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cu128 torch torchaudio torchvision
          pip install openai-whisper pyinstaller tiktoken "pyannote.audio==4.0.4" sounddevice soundfile

      - name: Build EXE
        run: pyinstaller sbobinator.spec

      - name: Download ffmpeg
        run: |
          curl -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          7z x ffmpeg.zip -offmpeg_tmp
          $ffmpegExe = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination dist/ffmpeg.exe
        shell: pwsh

      - name: Create split bundle
        # Volumi 7z da 1800 MiB: l'asset GitHub ha un limite di 2 GiB per file e
        # il bundle cu128 pesa ~3 GB. Produce verbaLIA.7z.001, verbaLIA.7z.002...
        run: |
          cd dist
          7z a -v1800m ../verbaLIA.7z verbaLIA.exe ffmpeg.exe
        shell: pwsh

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: verbaLIA
          path: verbaLIA.7z.*
          retention-days: 30

      - name: Publish to release v1.0
        env:
          GH_TOKEN: ${{ github.token }}
        # Carica tutti i volumi (.001, .002, ...) sostituendo quelli esistenti.
        run: |
          $parts = Get-ChildItem verbaLIA.7z.* | Select-Object -ExpandProperty Name
          Write-Host "Carico sulla release: $($parts -join ', ')"
          gh release upload v1.0 $parts --clobber
          if ($LASTEXITCODE -ne 0) { throw "Upload dei volumi fallito" }
          # Rimuove il vecchio bundle v1 ormai obsoleto (best-effort: ignora se assente)
          gh release delete-asset v1.0 Sbobinator.zip -y
          Write-Host "Pulizia asset obsoleti completata"
          exit 0
        shell: pwsh
